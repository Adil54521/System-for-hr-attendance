{% extends "admin/base_site.html" %}
{% block content %}
<h2>Регистрация сотрудника вручную</h2>

{% if error %}
  <div style="color: red;">{{ error }}</div>
{% elif success %}
  <div style="color: green;">{{ success }}</div>
{% endif %}

<form method="post">
  {% csrf_token %}
  <div class="form-group">
    <label>Ф.И.О. сотрудника</label>
    <input type="text" name="fio" class="form-control" required>
  </div>
  <div class="form-group">
    <label>device_token (Fingerprint)</label>
    <input type="text" name="device_token" class="form-control" required>
  </div>
  <br>
  <button type="submit" class="btn btn-success">Привязать</button>
</form>
{% endblock %}
